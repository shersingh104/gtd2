<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vacancy Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f4f7fb;color:#172033}
header{background:linear-gradient(135deg,#173b75,#2864b8);color:#fff;padding:24px 28px}
header h1{margin:0 0 5px;font-size:28px} header p{margin:0;opacity:.88}
.container{max-width:1500px;margin:20px auto;padding:0 18px}
.panel,.card{background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.panel{padding:18px;margin-bottom:18px}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
label{font-weight:600;font-size:13px;display:block;margin-bottom:6px}
select,input{width:100%;padding:10px 11px;border:1px solid #ccd5e2;border-radius:8px;background:#fff;font-size:14px}
.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
button{border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}
.primary{background:#2166c1;color:#fff}.secondary{background:#e9eef5;color:#22314a}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.card{padding:17px}.card .value{font-size:26px;font-weight:700;margin-top:5px}.card .label{color:#68758a;font-size:13px}
.table-wrap{overflow:auto;border:1px solid #e1e7ef;border-radius:9px}
table{border-collapse:collapse;width:100%;min-width:800px;font-size:13px}
th{position:sticky;top:0;background:#edf3fb;color:#1d365b;text-align:left;padding:11px;border-bottom:2px solid #d7e1ee}
td{padding:9px 11px;border-bottom:1px solid #edf0f4;white-space:nowrap}
tr:hover td{background:#f8fbff}
.pagination{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
.page-buttons{display:flex;gap:6px}
.small{font-size:12px;color:#68758a}
.empty{padding:30px;text-align:center;color:#68758a}
#sheetWrap{display:none}
@media print{body{background:#fff}.no-print{display:none!important}.container{max-width:none;margin:0}.panel,.card{box-shadow:none}.table-wrap{overflow:visible;border:0}table{font-size:9px;min-width:0}th{position:static}}
</style>
</head>
<body>
<header>
  <h1>Vacancy Dashboard</h1>
  <p>Interactive view of the uploaded Excel data</p>
</header>

<div class="container">
  <div class="panel no-print">
    <div class="controls">
      <div>
        <label>Sheet</label>
        <select id="sheetSelect"></select>
      </div>
      <div>
        <label>Search all data</label>
        <input id="search" placeholder="Search school, district, cadre, etc.">
      </div>
    </div>
    <div id="filters" class="controls" style="margin-top:14px"></div>
    <div class="buttons">
      <button class="primary" onclick="exportPDF()">Export filtered data to PDF</button>
      <button class="secondary" onclick="resetFilters()">Reset filters</button>
    </div>
  </div>

  <div class="cards">
    <div class="card"><div class="label">Filtered records</div><div class="value" id="recordCount">0</div></div>
    <div class="card"><div class="label">Total records</div><div class="value" id="totalCount">0</div></div>
    <div class="card"><div class="label">Columns</div><div class="value" id="columnCount">0</div></div>
  </div>

  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px">
      <h2 style="margin:0;font-size:19px">Data</h2>
      <span class="small" id="rangeInfo"></span>
    </div>
    <div class="table-wrap" id="tableWrap"></div>
    <div class="pagination no-print">
      <div class="small">Rows per page</div>
      <select id="pageSize" style="width:90px" onchange="renderTable()">
        <option>25</option><option>50</option><option>100</option><option>250</option>
      </select>
      <div class="page-buttons">
        <button class="secondary" onclick="changePage(-1)">Previous</button>
        <button class="secondary" onclick="changePage(1)">Next</button>
      </div>
    </div>
  </div>
</div>

      const wrap=document.createElement("div");
      const lab=document.createElement("label"); lab.textContent=c; wrap.appendChild(lab);
      const sel=document.createElement("select"); sel.dataset.col=c;
      let opts='<option value="">All</option>';
      vals.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:"base"}));
      vals.forEach(v=>opts+=`<option value="${escapeAttr(v)}">${escapeHtml(v)}</option>`);
      sel.innerHTML=opts; sel.onchange=()=>{page=1;applyFilters();};
      wrap.appendChild(sel);box.appendChild(wrap);
    }
  });
}

function applyFilters(){
  const q=norm($("search").value);
  const sels=[...document.querySelectorAll("#filters select")];
  filtered=rows.filter(r=>{
    if(q && !columns.some(c=>norm(r[c]).includes(q))) return false;
    return sels.every(s=>!s.value || clean(r[s.dataset.col]).trim()===s.value);
  });
  $("recordCount").textContent=filtered.length.toLocaleString();
  $("totalCount").textContent=rows.length.toLocaleString();
  $("columnCount").textContent=columns.length.toLocaleString();
  renderTable();
}

function renderTable(){
  const size=Number($("pageSize").value);
  const pages=Math.max(1,Math.ceil(filtered.length/size));
  if(page>pages) page=pages;
  const start=(page-1)*size, end=Math.min(start+size,filtered.length);
  $("rangeInfo").textContent=filtered.length?`${start+1}-${end} of ${filtered.length.toLocaleString()}`:"0 records";
  if(!filtered.length){$("tableWrap").innerHTML='<div class="empty">No records match the selected filters.</div>';return;}
  let h="<table><thead><tr>"+columns.map(c=>`<th>${escapeHtml(c)}</th>`).join("")+"</tr></thead><tbody>";
  filtered.slice(start,end).forEach(r=>{
    h+="<tr>"+columns.map(c=>`<td>${escapeHtml(r[c])}</td>`).join("")+"</tr>";
  });
  h+="</tbody></table>"; $("tableWrap").innerHTML=h;
}
function changePage(delta){page+=delta;renderTable();}
function resetFilters(){
  $("search").value="";
  document.querySelectorAll("#filters select").forEach(s=>s.value="");
  page=1;applyFilters();
}
function escapeHtml(v){
  return clean(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function escapeAttr(v){return escapeHtml(v).replace(/'/g,"&#39;");}

function exportPDF(){
  // Print only the currently filtered dataset. Browser print dialog supports
  // "Save as PDF" and preserves all filtered rows across pages.
  const title="Vacancy Dashboard - Filtered Data";
  const w=window.open("","_blank");
  if(!w){alert("Please allow pop-ups to export the PDF.");return;}
  let h=`<!doctype html><html><head><title>${title}</title><style>
  @page{size:A4 landscape;margin:10mm}body{font-family:Arial,sans-serif;font-size:8px}
  h1{font-size:16px;margin:0 0 5px}p{font-size:9px;margin:0 0 10px}
  table{border-collapse:collapse;width:100%}th,td{border:1px solid #999;padding:4px;text-align:left}
  th{background:#eee}tr{page-break-inside:avoid}
  </style></head><body><h1>${title}</h1>
  <p>Sheet: ${escapeHtml(sheetName)} | Records: ${filtered.length.toLocaleString()}</p>
  <table><thead><tr>${columns.map(c=>`<th>${escapeHtml(c)}</th>`).join("")}</tr></thead><tbody>`;
  filtered.forEach(r=>{h+="<tr>"+columns.map(c=>`<td>${escapeHtml(r[c])}</td>`).join("")+"</tr>";});
  h+="</tbody></table></body></html>";
  w.document.write(h);w.document.close();w.focus();
  setTimeout(()=>w.print(),500);
}
init();
</script>
</body>
</html>
